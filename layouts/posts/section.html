{{ define "main" }}
<div class="post-list-container post-list-container-shadow">
  {{ $posts := where .RegularPages "Params.hidden" "ne" true }}
  {{ $paginator := .Paginate $posts.ByDate.Reverse }}
  {{ range $paginator.Pages.GroupByDate "2006" }}
  <div class="post-item-wrapper post-item-wrapper-no-hover"><div class="post-item post-item-no-gaps"><div class="post-item-info-wrapper"><div class="post-item-title post-item-title-small year">{{ .Key }}</div></div></div></div>
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" class="a-block"><div class="post-item-wrapper"><div class="post-item post-item-no-gaps"><div class="post-item-info-wrapper"><div class="post-item-title">{{ .Title }}</div>{{ partial "post-item-meta.html" . }}</div></div></div></a>
  {{ end }}
  {{ end }}
</div>
{{ end }}
